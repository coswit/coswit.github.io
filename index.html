<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- 主题 vue buble dark pure dolphin-->
  <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css"> -->

  <!-- docsify-themeable 主题 theme-simple theme-simple-dark -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <!-- 暗色主题（叠加在 theme-simple 之上，通过 JS 启用/禁用） -->
  <link rel="stylesheet" id="theme-dark-link" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css" disabled>

  <!-- 侧边栏文档样式 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar-folder.min.css"/>

  <link rel="stylesheet" href="./css/custom.css">

  <!-- 切换主题前尽快应用，避免页面闪烁 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('docsify-theme'); // 'light' | 'dark' | null(跟随系统)
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var useDark = saved ? saved === 'dark' : prefersDark;
        var darkLink = document.getElementById('theme-dark-link');
        if (darkLink) darkLink.disabled = !useDark;
        document.documentElement.classList.toggle('dark', useDark);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>

  <!-- 主题切换按钮 -->
  <button id="theme-toggle" type="button" aria-label="切换主题" title="切换白天/黑夜模式">
    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <script>
  // 主题切换：light / dark，未设置时跟随系统
  (function () {
    var KEY = 'docsify-theme';
    var darkLink = document.getElementById('theme-dark-link');
    var btn = document.getElementById('theme-toggle');

    function isDarkActive() {
      return darkLink && !darkLink.disabled;
    }

    // 更新按钮图标：暗色模式显示太阳（点击切回白天），白天显示月亮
    function updateIcon() {
      var dark = isDarkActive();
      btn.classList.toggle('is-dark', dark);
    }

    function applyDark(useDark) {
      if (darkLink) darkLink.disabled = !useDark;
      document.documentElement.classList.toggle('dark', useDark);
      updateIcon();
    }

    function currentMode() {
      var saved = localStorage.getItem(KEY);
      if (saved === 'light' || saved === 'dark') return saved;
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      return prefersDark ? 'dark' : 'light';
    }

    function toggle() {
      var next = currentMode() === 'dark' ? 'light' : 'dark';
      localStorage.setItem(KEY, next);
      applyDark(next === 'dark');
    }

    btn.addEventListener('click', toggle);

    // 跟随系统变化（仅当用户未手动设置时）
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (!localStorage.getItem(KEY)) applyDark(e.matches);
      });
    }

    // 初始图标同步（初始 link 状态已由 head 中脚本设置）
    updateIcon();
  })();
  </script>
  <script>
  window.$docsify = {
    name: '',
    repo: '',
	  homepage: '_sidebar.md',
	  loadSidebar: true,
	  subMaxLevel: 5,
	  auto2top: true,
	  relativePath: false,
    sidebarDisplayLevel: 0, // set sidebar display level

    search: {
        maxAge: 86400000,
        placeholder: '搜索',
        noData: '找不到结果',
        depth: 3
    },

    themeable: {
        readyTransition : true, // default
        responsiveTables: true  // default
    },

    markdown: {
      renderer: {
        // 重写加粗渲染规则
        strong: function(text) {
          return '<strong>' + text + '</strong>';
        }
      },
      smartypants: true,
      breaks: true,
      langPrefix: 'language-'
    },

    mermaid: {
        theme: 'forest',
        flowchart: { useMaxWidth: true }
    },
	
	copyCode: {
      buttonText: '复制',
      errorText:  '错误',
      successText: '已复制'
    },
    
    plugins: [
      function(hook, vm) {
        hook.beforeEach(function(content) {
          // 预处理中文加粗问题
          return content.replace(/\*\*(.*?)\*\*/g, function(match, p1) {
            return '<strong>' + p1 + '</strong>';
          });
        });
      },
          
      function(hook, vm) {
        hook.ready(function() {
          // 确保 KaTeX 加载完成后再初始化
          if (typeof renderMathInElement === 'function') {
            renderMathInElement(document.body, {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false},
                {left: '\\[', right: '\\]', display: true}
              ],
              macros: {
                '\\foo': 'x^2',
                '\\Harr': '\\Leftrightarrow',
                '\\Lrarr': '\\Leftrightarrow',
                '\\lrArr': '\\Leftrightarrow',
                '\\plusmn': '\\pm'
              },
              throwOnError: false
            });
          }
        });
      },

    function(hook, vm) {
        hook.doneEach(function () {
          // 确保 Prism 已加载且可用
          if (typeof Prism !== 'undefined' && typeof Prism.highlightAll === 'function') {
            // 在下一个事件循环中执行，确保 DOM 已完全更新
            setTimeout(Prism.highlightAll, 0);
          }
        });
    },

    function(hook, vm) {
        hook.doneEach(function() {
            setTimeout(function() {
                var contentEl = document.querySelector('.content');
                var sidebarToc = document.querySelector('.sidebar .app-sub-sidebar');
                if (!contentEl || !sidebarToc) return;

                var existing = contentEl.querySelector('.toc-panel');
                if (existing) existing.remove();

                var panel = document.createElement('div');
                panel.className = 'toc-panel';

                var title = document.createElement('div');
                title.className = 'toc-title';
                title.textContent = '本页目录';

                var tocContent = document.createElement('div');
                tocContent.className = 'toc-content';

                var marker = document.createElement('div');
                marker.className = 'toc-marker';
                tocContent.appendChild(marker);

                var cloned = sidebarToc.cloneNode(true);
                tocContent.appendChild(cloned);

                panel.appendChild(title);
                panel.appendChild(tocContent);
                contentEl.appendChild(panel);

                var tocLinks = panel.querySelectorAll('a');
                var lastActive = '';

                function syncTocActive() {
                    var headings = document.querySelectorAll('.markdown-section > h1, .markdown-section > h2, .markdown-section > h3, .markdown-section > h4, .markdown-section > h5');
                    var current = '';
                    for (var i = headings.length - 1; i >= 0; i--) {
                        if (headings[i].getBoundingClientRect().top <= 150) {
                            current = headings[i].id || '';
                            break;
                        }
                    }
                    if (current === lastActive) return;
                    lastActive = current;
                    var activeLi = null;
                    tocLinks.forEach(function(link) {
                        var li = link.parentElement;
                        var href = link.getAttribute('href') || '';
                        var targetId = decodeURIComponent((href.match(/[?&]id=([^&]+)/) || [,''])[1]);
                        if (targetId === current) {
                            li.classList.add('active');
                            activeLi = li;
                        } else {
                            li.classList.remove('active');
                        }
                    });
                    if (activeLi) {
                        marker.classList.add('visible');
                        marker.style.top = (activeLi.offsetTop + 7) + 'px';
                    } else {
                        marker.classList.remove('visible');
                    }
                }

                window.addEventListener('scroll', syncTocActive, {passive: true});
                syncTocActive();
            }, 200);
        });
    }
    ]
  };
  </script>
  <!-- Docsify 核心脚本 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <!-- docsify-themeable 主题 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>

  <script src="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css" />
  <script src="//cdn.jsdelivr.net/npm/marked@4"></script>
  <!-- CDN files for docsify-katex -->
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  <!-- or <script src="//cdn.jsdelivr.net/gh/upupming/docsify-katex@latest/dist/docsify-katex.js"></script> -->

  <!-- Mermaid 插件 -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@latest/dist/docsify-mermaid.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>

  <!-- plugins 侧边栏样式  -->
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  
  <!-- 代码复制 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>

  <!-- 代码高亮 -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/autoloader/prism-autoloader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/autoloader/prism-java.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/autoloader/prism-cpp.min.js"></script>
</body>
</html>
