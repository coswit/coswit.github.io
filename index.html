<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- 第三方库已自托管到 ./vendor/（原 jsdelivr 在部分网络下 TLS 慢且频繁断连，是首屏白屏的主因） -->
  <!-- prism autoloader 的语言组件仍按需从 CDN 加载，提前建连减少首次高亮的延迟 -->
  <link rel="dns-prefetch" href="//cdn.jsdelivr.net">

  <!-- docsify-themeable 主题 theme-simple theme-simple-dark -->
  <link rel="stylesheet" href="./vendor/theme-simple.css">
  <!-- 暗色主题（叠加在 theme-simple 之上，通过 JS 启用/禁用） -->
  <link rel="stylesheet" id="theme-dark-link" href="./vendor/theme-simple-dark.css" disabled>

  <!-- 侧边栏文档样式 -->
  <link rel="stylesheet" href="./vendor/sidebar-folder.min.css"/>

  <link rel="stylesheet" href="./css/custom.css">

  <!-- 切换主题前尽快应用，避免页面闪烁 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('docsify-theme'); // 'light' | 'dark' | null(跟随系统)
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var useDark = saved ? saved === 'dark' : prefersDark;
        var darkLink = document.getElementById('theme-dark-link');
        if (darkLink) darkLink.disabled = !useDark;
        document.documentElement.classList.toggle('dark', useDark);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- docsify 渲染完成前显示占位内容（渲染时被整体替换），缩短感知白屏时间 -->
  <div id="app">
    <div class="app-loading">
      <div class="app-loading-spinner"></div>
      <div class="app-loading-text">加载中…</div>
    </div>
  </div>

  <!-- 主题切换按钮 -->
  <button id="theme-toggle" type="button" aria-label="切换主题" title="切换白天/黑夜模式">
    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <script>
  // 主题切换：light / dark，未设置时跟随系统
  (function () {
    var KEY = 'docsify-theme';
    var darkLink = document.getElementById('theme-dark-link');
    var btn = document.getElementById('theme-toggle');

    function isDarkActive() {
      return darkLink && !darkLink.disabled;
    }

    // 更新按钮图标：暗色模式显示太阳（点击切回白天），白天显示月亮
    function updateIcon() {
      var dark = isDarkActive();
      btn.classList.toggle('is-dark', dark);
    }

    function applyDark(useDark) {
      if (darkLink) darkLink.disabled = !useDark;
      document.documentElement.classList.toggle('dark', useDark);
      updateIcon();
      // 明暗切换后用新主题重绘 mermaid 图
      // （mermaid 是懒加载的，该函数定义时可能尚未加载，需判空调用）
      if (window.__rerenderMermaid) window.__rerenderMermaid();
    }

    function currentMode() {
      var saved = localStorage.getItem(KEY);
      if (saved === 'light' || saved === 'dark') return saved;
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      return prefersDark ? 'dark' : 'light';
    }

    function toggle() {
      var next = currentMode() === 'dark' ? 'light' : 'dark';
      localStorage.setItem(KEY, next);
      applyDark(next === 'dark');
    }

    btn.addEventListener('click', toggle);

    // 跟随系统变化（仅当用户未手动设置时）
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (!localStorage.getItem(KEY)) applyDark(e.matches);
      });
    }

    // 初始图标同步（初始 link 状态已由 head 中脚本设置）
    updateIcon();
  })();
  </script>
  <script>
  window.$docsify = {
    name: '',
    repo: '',
	  homepage: '_sidebar.md',
	  loadSidebar: true,
	  subMaxLevel: 5,
	  auto2top: true,
	  relativePath: false,
    sidebarDisplayLevel: 0, // set sidebar display level

    search: {
        maxAge: 86400000,
        placeholder: '搜索',
        noData: '找不到结果',
        depth: 3
    },

    themeable: {
        readyTransition : true, // default
        responsiveTables: true  // default
    },

    markdown: {
      renderer: {
        // 重写加粗渲染规则
        strong: function(text) {
          return '<strong>' + text + '</strong>';
        }
      },
      smartypants: true,
      breaks: true,
      langPrefix: 'language-'
    },

    // mermaidConfig 原供 docsify-mermaid 使用；现由下方懒加载插件自行传给 mermaid.run
    copyCode: {
      buttonText: '复制',
      errorText:  '错误',
      successText: '已复制'
    },

    plugins: [
      // 缓存 mermaid 图源码：渲染后原始源码会被 SVG 替换；
      // 切换明暗主题重绘时需要源码。
      // 必须注册在懒加载插件（doneEach 调用 mermaid.run）之前，保证先于渲染执行缓存
      function(hook, vm) {
        hook.doneEach(function() {
          document.querySelectorAll('div.mermaid').forEach(function(el) {
            if (el.__mermaidSrc === undefined) el.__mermaidSrc = el.textContent;
          });
        });
      },

      function(hook, vm) {
        hook.beforeEach(function(content) {
          // 预处理中文加粗问题
          return content.replace(/\*\*(.*?)\*\*/g, function(match, p1) {
            return '<strong>' + p1 + '</strong>';
          });
        });
      },

      function(hook, vm) {
        hook.ready(function() {
          // 确保 KaTeX 加载完成后再初始化
          if (typeof renderMathInElement === 'function') {
            renderMathInElement(document.body, {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false},
                {left: '\\[', right: '\\]', display: true}
              ],
              macros: {
                '\\foo': 'x^2',
                '\\Harr': '\\Leftrightarrow',
                '\\Lrarr': '\\Leftrightarrow',
                '\\lrArr': '\\Leftrightarrow',
                '\\plusmn': '\\pm'
              },
              throwOnError: false
            });
          }
        });
      },

    function(hook, vm) {
        hook.doneEach(function () {
          // 确保 Prism 已加载且可用
          if (typeof Prism !== 'undefined' && typeof Prism.highlightAll === 'function') {
            // 在下一个事件循环中执行，确保 DOM 已完全更新
            setTimeout(Prism.highlightAll, 0);
          }
        });
    },

    // —— mermaid 懒加载（替代 docsify-mermaid 插件）——
    // mermaid.min.js 约 3.5MB 且绝大多数页面没有图，不能阻塞首屏同步加载：
    // afterEach 先把 ```mermaid 代码块转换成 div.mermaid（与 docsify-mermaid 行为一致），
    // doneEach 时页面里确实出现图才按需注入脚本；渲染逻辑等价于 docsify-mermaid 的
    // doneEach -> mermaid.run(mermaidConfig)
    function(hook, vm) {
        // 把 mermaid 代码块转换成 <div class="mermaid">：
        // docsify 输出形如 <pre v-pre data-lang="mermaid"><code class="language-mermaid">
        hook.afterEach(function (html, next) {
          if (!/(<code[^>]*mermaid|<pre[^>]*data-lang=["']?mermaid)/.test(html)) return next(html);
          var container = document.createElement('div');
          container.innerHTML = html;
          container.querySelectorAll(
            'pre[data-lang="mermaid"], pre > code[class*="mermaid"]'
          ).forEach(function (el) {
            var pre = el.tagName === 'PRE' ? el : el.parentElement;
            // 同一代码块可能被上面两条选择器同时命中：pre 先被换成 div 后，
            // 内部 code 已随 pre 脱离文档，必须跳过（否则 replaceChild 抛错中断渲染链）
            if (!pre || !container.contains(pre)) return;
            var div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = el.textContent;
            pre.parentNode.replaceChild(div, pre);
          });
          next(container.innerHTML);
        });

        hook.doneEach(function () {
          if (!document.querySelector('div.mermaid')) return;
          loadMermaidThenRun();
        });
    },

    function(hook, vm) {
        // 保存上一次的滚动监听器，导航时先移除，避免监听器随页面切换不断叠加（泄漏）
        var tocScrollHandler = null;
        hook.doneEach(function() {
            setTimeout(function() {
                var contentEl = document.querySelector('.content');
                if (!contentEl) return;

                // 先移除旧面板：页面无标题时也不会残留上一页的目录
                var existing = document.querySelector('.toc-panel');
                if (existing) existing.remove();

                // 直接从当前页面标题生成目录（h2~h5，与 subMaxLevel 一致）。
                // 不再克隆侧边栏的 app-sub-sidebar：它由 docsify 异步刷新，
                // 通过正文链接跳转后克隆时机可能早于侧边栏更新，导致目录显示成上一页的内容
                var headings = document.querySelectorAll(
                    '.markdown-section > h2, .markdown-section > h3, .markdown-section > h4, .markdown-section > h5');
                if (!headings.length) return;

                var panel = document.createElement('div');
                panel.className = 'toc-panel';

                var title = document.createElement('div');
                title.className = 'toc-title';
                title.textContent = '本页目录';

                var tocContent = document.createElement('div');
                tocContent.className = 'toc-content';

                var marker = document.createElement('div');
                marker.className = 'toc-marker';
                tocContent.appendChild(marker);

                // 按 heading 层级生成嵌套列表（结构与 docsify 侧边栏目录一致：li > a + ul）
                var basePath = location.hash.split('?')[0];
                var root = document.createElement('ul');
                root.className = 'app-sub-sidebar';
                var stack = [{ level: 1, li: null, ul: root }];
                headings.forEach(function(h) {
                    var level = parseInt(h.tagName.charAt(1), 10);
                    while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
                    var parent = stack[stack.length - 1];

                    var li = document.createElement('li');
                    var a = document.createElement('a');
                    a.href = basePath + '?id=' + encodeURIComponent(h.id);
                    a.textContent = h.textContent;
                    li.appendChild(a);

                    if (parent.li && level > parent.level) {
                        // 更深层级：挂到父标题 li 的子列表下（跳级时逐级补桥接列表）
                        var node = parent.ul;
                        for (var l = parent.level + 1; l < level; l++) {
                            var bridge = document.createElement('ul');
                            node.appendChild(bridge);
                            node = bridge;
                        }
                        node.appendChild(li);
                    } else {
                        parent.ul.appendChild(li);
                    }

                    // 本层子标题的容器（空的最后统一清掉）
                    var own = document.createElement('ul');
                    li.appendChild(own);
                    stack.push({ level: level, li: li, ul: own });
                });
                root.querySelectorAll('ul').forEach(function(u) {
                    if (!u.children.length) u.remove();
                });
                tocContent.appendChild(root);

                panel.appendChild(title);
                panel.appendChild(tocContent);
                // 挂到 body 而非 .content：收起侧边栏时主题会给 .content 加
                // transform（translateX(0)），transform 的祖先会成为 fixed 元素的
                // 定位基准，导致 fixed 的目录面板在页面滚动时跟着滚走
                document.body.appendChild(panel);

                var tocLinks = panel.querySelectorAll('a');
                var lastActive = '';

                // 缓存标题列表和链接目标 id：滚动回调里只做位置比较，
                // 不再每次 scroll 都全量 querySelectorAll + 正则 + decode
                var hs = Array.prototype.slice.call(document.querySelectorAll(
                    '.markdown-section > h1, .markdown-section > h2, .markdown-section > h3, .markdown-section > h4, .markdown-section > h5'));
                var linkTargets = [];
                tocLinks.forEach(function (link) {
                    var href = link.getAttribute('href') || '';
                    var targetId = (href.match(/[?&]id=([^&]+)/) || [,''])[1];
                    try { targetId = decodeURIComponent(targetId); } catch (e) {}
                    linkTargets.push({ li: link.parentElement, id: targetId });
                });

                // 直接调用：查询已全部缓存，单个滚动事件的代价只是
                // 遍历标题做位置比较，无需 rAF（后台标签页 rAF 会被暂停）
                function syncTocActive() {
                    var current = '';
                    for (var i = hs.length - 1; i >= 0; i--) {
                        if (hs[i].getBoundingClientRect().top <= 150) {
                            current = hs[i].id || '';
                            break;
                        }
                    }
                    if (current === lastActive) return;
                    lastActive = current;
                    var activeLi = null;
                    linkTargets.forEach(function (t) {
                        if (t.id === current) {
                            t.li.classList.add('active');
                            activeLi = t.li;
                        } else {
                            t.li.classList.remove('active');
                        }
                    });
                    if (activeLi) {
                        marker.classList.add('visible');
                        marker.style.top = (activeLi.offsetTop + 7) + 'px';
                    } else {
                        marker.classList.remove('visible');
                    }
                }

                if (tocScrollHandler) {
                    window.removeEventListener('scroll', tocScrollHandler);
                }
                tocScrollHandler = syncTocActive;
                window.addEventListener('scroll', syncTocActive, {passive: true});
                syncTocActive();
            }, 200);
        });
    },

    // 侧边栏当前页高亮兜底修正：docsify 把 active 加在 <a> 上，但 sidebar-collapse
    // 插件重写侧边栏 DOM 时会丢失（子目录显示规则 .active + ul 也依赖它），
    // 且侧边栏按路由重新拉取/渲染是异步的，单次延时修正跑不赢。
    // 这里用 MutationObserver 监听侧边栏重写，任何一次重写后都重新应用 active
    function(hook, vm) {
        var applyActive = function () {
            window.__SIDEBAR_FIX__ = 'v4';   // 版本标记：控制台输入 __SIDEBAR_FIX__ 可查当前运行的修复版本（v4=自动展开文件夹）
            // 两侧都要安全解码：hash 是百分号编码，而侧边栏 href 里含手写的 %20
            // （如 "Effective Java" 目录），只解码一边会导致含空格的条目永远匹配不上；
            // decode 遇到非法 % 序列会抛 URIError，需要 try/catch 兜底。
            // 还要折叠 "/./" 段：workflow 生成的侧边栏是 "./dir/file.md"（渲染成 #/./dir/file），
            // 正文链接是 "/dir/file.md"（渲染成 #/dir/file），两种路由只差这一段
            var norm = function (p) {
                p = p.replace(/^#/, '').split('?')[0]
                     .replace(/\/\.\//g, '/')   // 折叠 /./（侧边栏与正文链接的形式差异）
                     .replace(/\/+/g, '/')      // 折叠重复斜杠
                     .replace(/\/+$/, '')
                     .replace(/\.md$/i, '');
                try { return decodeURIComponent(p); } catch (e) { return p; }
            };
            var cur = norm(location.hash);
            var activeLi = null;
            document.querySelectorAll('.sidebar-nav a').forEach(function (a) {
                var raw = a.getAttribute('href') || '';
                if (raw.indexOf('?id=') !== -1) return; // 跳过页内锚点链接
                var isCur = norm(raw) === cur;
                a.classList.toggle('active', isCur);
                var li = a.parentElement;
                if (li && li.tagName === 'LI') li.classList.toggle('active', isCur);
                if (isCur) activeLi = li;
            });

            // 展开当前条目的祖先文件夹（sidebar-collapse 插件在路由切换后会按
            // sidebarDisplayLevel 重置为折叠，当前条目虽然高亮但被藏在文件夹里看不见），
            // 并把侧边栏滚动到该条目可见
            if (activeLi) {
                var node = activeLi.parentElement;
                while (node && !node.classList.contains('sidebar-nav')) {
                    if (node.tagName === 'UL') {
                        var folderLi = node.parentElement;
                        if (folderLi && folderLi.classList.contains('folder')) {
                            folderLi.classList.remove('collapsed');
                            folderLi.classList.add('open');
                        }
                    }
                    node = node.parentElement;
                }
                // 滚动侧边栏让当前条目进入视野（block:nearest 只滚动必要的祖先容器）
                try { activeLi.scrollIntoView({block: 'nearest', behavior: 'smooth'}); } catch (e) {}
            }
        };
        var scheduled = false;
        hook.mounted(function () {
            var sidebar = document.querySelector('.sidebar');
            if (!sidebar || typeof MutationObserver === 'undefined') return;
            new MutationObserver(function () {
                if (scheduled) return;
                scheduled = true;
                setTimeout(function () { scheduled = false; applyActive(); }, 50);
            }).observe(sidebar, {childList: true, subtree: true});
        });
        hook.doneEach(function () { setTimeout(applyActive, 50); });
    }
    ]
  };

  // —— mermaid 懒加载实现 ——
  // 与原 docsify-mermaid 的初始化一致：startOnLoad 关闭、主题跟随站点明暗模式，
  // 实际渲染统一在首个图出现时或切换主题后的 run 回调中触发
  function currentMermaidTheme() {
    return document.documentElement.classList.contains('dark') ? 'dark' : 'default';
  }

  var __mermaidLoading = false;

  function runMermaid() {
    mermaid.run({ querySelector: 'div.mermaid', suppressErrors: true }).catch(function () {});
  }

  function loadMermaidThenRun() {
    if (window.mermaid) { runMermaid(); return; }
    if (__mermaidLoading) return; // 加载完成后的 onload 统一渲染当前 DOM 里的图
    __mermaidLoading = true;
    var s = document.createElement('script');
    s.src = './vendor/mermaid.min.js';
    s.onload = function () {
      __mermaidLoading = false;
      mermaid.initialize({
        startOnLoad: false,   // 避免与上面的 mermaid.run 重复渲染
        theme: currentMermaidTheme(),
        flowchart: { useMaxWidth: true },
        suppressErrors: true
      });
      runMermaid();
    };
    s.onerror = function () { __mermaidLoading = false; };
    document.head.appendChild(s);
  }

  // 切换主题后重绘当前页所有图：恢复缓存的源码、清掉已渲染标记，再重新 run。
  // mermaid 尚未加载（本会话还没出现过图）时直接跳过——下次有图的页面会以当前主题渲染
  window.__rerenderMermaid = function () {
    if (!window.mermaid) return;
    var els = document.querySelectorAll('div.mermaid');
    if (!els.length) return;
    mermaid.initialize({ theme: currentMermaidTheme(), suppressErrors: true });
    els.forEach(function (el) {
      var src = el.__mermaidSrc !== undefined ? el.__mermaidSrc : el.textContent;
      if (!src || !src.trim()) return;
      el.__mermaidSrc = src;
      el.removeAttribute('data-processed');
      el.textContent = src;
    });
    mermaid.run({ querySelector: 'div.mermaid', suppressErrors: true }).catch(function () {});
  };
  </script>

  <!-- Docsify 核心脚本（本地自托管，避免 jsdelivr 网络抖动阻塞首屏） -->
  <script src="./vendor/docsify.min.js"></script>
  <!-- docsify-themeable 主题 -->
  <script src="./vendor/docsify-themeable.min.js"></script>

  <script src="./vendor/marked.min.js"></script>

  <!-- KaTeX 数学公式（本地自托管，字体在同目录 fonts/ 下随 CSS 相对路径加载） -->
  <script src="./vendor/katex/katex.min.js"></script>
  <link rel="stylesheet" href="./vendor/katex/katex.min.css" />
  <script src="./vendor/docsify-katex.js"></script>

  <script src="./vendor/zoom-image.min.js"></script>
  <script src="./vendor/search.min.js"></script>

  <!-- plugins 侧边栏样式  -->
  <script src="./vendor/docsify-sidebar-collapse.min.js"></script>

  <!-- 代码复制 -->
  <script src="./vendor/docsify-copy-code.min.js"></script>

  <!-- 代码高亮：autoloader 本地化后语言组件改为指向 CDN 的 components 目录，
       只有页面出现对应语言时才按需下载，不影响首屏。
       （原配置里的 prism-java/prism-cpp 两个链接在 npm 包中不存在，属死链，已移除） -->
  <script src="./vendor/prism-autoloader.min.js"></script>
  <script>
    if (window.Prism && Prism.plugins && Prism.plugins.autoloader) {
      Prism.plugins.autoloader.languages_path = 'https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/';
    }
  </script>
</body>
</html>
