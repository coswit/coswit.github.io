<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- 第三方库已自托管到 ./vendor/（原 jsdelivr 在部分网络下 TLS 慢且频繁断连，是首屏白屏的主因） -->
  <!-- prism autoloader 的语言组件仍按需从 CDN 加载，提前建连减少首次高亮的延迟 -->
  <link rel="dns-prefetch" href="//cdn.jsdelivr.net">

  <!-- docsify-themeable 主题 theme-simple theme-simple-dark -->
  <link rel="stylesheet" href="./vendor/theme-simple.css">
  <!-- 暗色主题（叠加在 theme-simple 之上，通过 JS 启用/禁用） -->
  <link rel="stylesheet" id="theme-dark-link" href="./vendor/theme-simple-dark.css" disabled>

  <!-- 侧边栏文档样式 -->
  <link rel="stylesheet" href="./vendor/sidebar-folder.min.css"/>

  <link rel="stylesheet" href="./css/custom.css">

  <!-- 切换主题前尽快应用，避免页面闪烁 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('docsify-theme'); // 'light' | 'dark' | null(跟随系统)
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var useDark = saved ? saved === 'dark' : prefersDark;
        var darkLink = document.getElementById('theme-dark-link');
        if (darkLink) darkLink.disabled = !useDark;
        document.documentElement.classList.toggle('dark', useDark);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- docsify 渲染完成前显示占位内容（渲染时被整体替换），缩短感知白屏时间 -->
  <div id="app">
    <div class="app-loading">
      <div class="app-loading-spinner"></div>
      <div class="app-loading-text">加载中…</div>
    </div>
  </div>

  <!-- 主题切换按钮 -->
  <button id="theme-toggle" type="button" aria-label="切换主题" title="切换白天/黑夜模式">
    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <script>
  // 主题切换：light / dark，未设置时跟随系统
  (function () {
    var KEY = 'docsify-theme';
    var darkLink = document.getElementById('theme-dark-link');
    var btn = document.getElementById('theme-toggle');

    function isDarkActive() {
      return darkLink && !darkLink.disabled;
    }

    // 更新按钮图标：暗色模式显示太阳（点击切回白天），白天显示月亮
    function updateIcon() {
      var dark = isDarkActive();
      btn.classList.toggle('is-dark', dark);
    }

    function applyDark(useDark) {
      if (darkLink) darkLink.disabled = !useDark;
      document.documentElement.classList.toggle('dark', useDark);
      updateIcon();
      // 明暗切换后用新主题重绘 mermaid 图
      // （mermaid 是懒加载的，该函数定义时可能尚未加载，需判空调用）
      if (window.__rerenderMermaid) window.__rerenderMermaid();
    }

    function currentMode() {
      var saved = localStorage.getItem(KEY);
      if (saved === 'light' || saved === 'dark') return saved;
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      return prefersDark ? 'dark' : 'light';
    }

    function toggle() {
      var next = currentMode() === 'dark' ? 'light' : 'dark';
      localStorage.setItem(KEY, next);
      applyDark(next === 'dark');
    }

    btn.addEventListener('click', toggle);

    // 跟随系统变化（仅当用户未手动设置时）
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (!localStorage.getItem(KEY)) applyDark(e.matches);
      });
    }

    // 初始图标同步（初始 link 状态已由 head 中脚本设置）
    updateIcon();
  })();
  </script>
  <script>
  window.$docsify = {
    name: '',
    repo: '',
	  homepage: '_sidebar.md',
	  loadSidebar: true,
	  subMaxLevel: 5,
	  auto2top: true,
	  relativePath: false,
    sidebarDisplayLevel: 0, // set sidebar display level

    search: {
        maxAge: 86400000,
        placeholder: '搜索',
        noData: '找不到结果',
        depth: 3
    },

    themeable: {
        readyTransition : true, // default
        responsiveTables: true  // default
    },

    markdown: {
      renderer: {
        // 重写加粗渲染规则
        strong: function(text) {
          return '<strong>' + text + '</strong>';
        }
      },
      smartypants: true,
      breaks: true,
      langPrefix: 'language-'
    },

    // mermaidConfig 原供 docsify-mermaid 使用；现由下方懒加载插件自行传给 mermaid.run
    copyCode: {
      buttonText: '复制',
      errorText:  '错误',
      successText: '已复制'
    },

    plugins: [
      // 缓存 mermaid 图源码：渲染后原始源码会被 SVG 替换；
      // 切换明暗主题重绘时需要源码。
      // 必须注册在懒加载插件（doneEach 调用 mermaid.run）之前，保证先于渲染执行缓存
      function(hook, vm) {
        hook.doneEach(function() {
          document.querySelectorAll('div.mermaid').forEach(function(el) {
            if (el.__mermaidSrc === undefined) el.__mermaidSrc = el.textContent;
          });
        });
      },

      // 正文图片挂“点击放大”悬浮提示（与 mermaid 图共用灯箱）；
      // 链接内的图片保留跳转行为、.no-zoom 明确排除，都不加提示
      function(hook, vm) {
        hook.doneEach(function() {
          document.querySelectorAll('.markdown-section img').forEach(function(img) {
            if (img.title || img.closest('a') || img.classList.contains('no-zoom')) return;
            img.title = '点击放大：滚轮缩放 · 拖动平移 · 双击复位';
          });
        });
      },

      function(hook, vm) {
        hook.beforeEach(function(content) {
          // 预处理中文加粗问题
          return content.replace(/\*\*(.*?)\*\*/g, function(match, p1) {
            return '<strong>' + p1 + '</strong>';
          });
        });
      },

      function(hook, vm) {
        hook.ready(function() {
          // 确保 KaTeX 加载完成后再初始化
          if (typeof renderMathInElement === 'function') {
            renderMathInElement(document.body, {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false},
                {left: '\\[', right: '\\]', display: true}
              ],
              macros: {
                '\\foo': 'x^2',
                '\\Harr': '\\Leftrightarrow',
                '\\Lrarr': '\\Leftrightarrow',
                '\\lrArr': '\\Leftrightarrow',
                '\\plusmn': '\\pm'
              },
              throwOnError: false
            });
          }
        });
      },

    function(hook, vm) {
        hook.doneEach(function () {
          // 确保 Prism 已加载且可用
          if (typeof Prism !== 'undefined' && typeof Prism.highlightAll === 'function') {
            // 在下一个事件循环中执行，确保 DOM 已完全更新
            setTimeout(Prism.highlightAll, 0);
          }
        });
    },

    // —— mermaid 懒加载（替代 docsify-mermaid 插件）——
    // mermaid.min.js 约 3.5MB 且绝大多数页面没有图，不能阻塞首屏同步加载：
    // afterEach 先把 ```mermaid 代码块转换成 div.mermaid（与 docsify-mermaid 行为一致），
    // doneEach 时页面里确实出现图才按需注入脚本；渲染逻辑等价于 docsify-mermaid 的
    // doneEach -> mermaid.run(mermaidConfig)
    function(hook, vm) {
        // 把 mermaid 代码块转换成 <div class="mermaid">：
        // docsify 输出形如 <pre v-pre data-lang="mermaid"><code class="language-mermaid">
        hook.afterEach(function (html, next) {
          if (!/(<code[^>]*mermaid|<pre[^>]*data-lang=["']?mermaid)/.test(html)) return next(html);
          var container = document.createElement('div');
          container.innerHTML = html;
          container.querySelectorAll(
            'pre[data-lang="mermaid"], pre > code[class*="mermaid"]'
          ).forEach(function (el) {
            var pre = el.tagName === 'PRE' ? el : el.parentElement;
            // 同一代码块可能被上面两条选择器同时命中：pre 先被换成 div 后，
            // 内部 code 已随 pre 脱离文档，必须跳过（否则 replaceChild 抛错中断渲染链）
            if (!pre || !container.contains(pre)) return;
            var div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = el.textContent;
            pre.parentNode.replaceChild(div, pre);
          });
          next(container.innerHTML);
        });

        hook.doneEach(function () {
          if (!document.querySelector('div.mermaid')) return;
          loadMermaidThenRun();
        });
    },

    function(hook, vm) {
        // 保存上一次的滚动监听器，导航时先移除，避免监听器随页面切换不断叠加（泄漏）
        var tocScrollHandler = null;
        hook.doneEach(function() {
            setTimeout(function() {
                var contentEl = document.querySelector('.content');
                if (!contentEl) return;

                // 先移除旧面板：页面无标题时也不会残留上一页的目录
                var existing = document.querySelector('.toc-panel');
                if (existing) existing.remove();

                // 直接从当前页面标题生成目录（h2~h5，与 subMaxLevel 一致）。
                // 不再克隆侧边栏的 app-sub-sidebar：它由 docsify 异步刷新，
                // 通过正文链接跳转后克隆时机可能早于侧边栏更新，导致目录显示成上一页的内容
                var headings = document.querySelectorAll(
                    '.markdown-section > h2, .markdown-section > h3, .markdown-section > h4, .markdown-section > h5');
                if (!headings.length) return;

                var panel = document.createElement('div');
                panel.className = 'toc-panel';

                var title = document.createElement('div');
                title.className = 'toc-title';
                title.textContent = '本页目录';

                var tocContent = document.createElement('div');
                tocContent.className = 'toc-content';

                var marker = document.createElement('div');
                marker.className = 'toc-marker';
                tocContent.appendChild(marker);

                // 按 heading 层级生成嵌套列表（结构与 docsify 侧边栏目录一致：li > a + ul）
                var basePath = location.hash.split('?')[0];
                var root = document.createElement('ul');
                root.className = 'app-sub-sidebar';
                var stack = [{ level: 1, li: null, ul: root }];
                headings.forEach(function(h) {
                    var level = parseInt(h.tagName.charAt(1), 10);
                    while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
                    var parent = stack[stack.length - 1];

                    var li = document.createElement('li');
                    var a = document.createElement('a');
                    a.href = basePath + '?id=' + encodeURIComponent(h.id);
                    a.textContent = h.textContent;
                    li.appendChild(a);

                    if (parent.li && level > parent.level) {
                        // 更深层级：挂到父标题 li 的子列表下（跳级时逐级补桥接列表）
                        var node = parent.ul;
                        for (var l = parent.level + 1; l < level; l++) {
                            var bridge = document.createElement('ul');
                            node.appendChild(bridge);
                            node = bridge;
                        }
                        node.appendChild(li);
                    } else {
                        parent.ul.appendChild(li);
                    }

                    // 本层子标题的容器（空的最后统一清掉）
                    var own = document.createElement('ul');
                    li.appendChild(own);
                    stack.push({ level: level, li: li, ul: own });
                });
                root.querySelectorAll('ul').forEach(function(u) {
                    if (!u.children.length) u.remove();
                });
                tocContent.appendChild(root);

                panel.appendChild(title);
                panel.appendChild(tocContent);
                // 挂到 body 而非 .content：收起侧边栏时主题会给 .content 加
                // transform（translateX(0)），transform 的祖先会成为 fixed 元素的
                // 定位基准，导致 fixed 的目录面板在页面滚动时跟着滚走
                document.body.appendChild(panel);

                var tocLinks = panel.querySelectorAll('a');
                var lastActive = '';

                // 缓存标题列表和链接目标 id：滚动回调里只做位置比较，
                // 不再每次 scroll 都全量 querySelectorAll + 正则 + decode
                var hs = Array.prototype.slice.call(document.querySelectorAll(
                    '.markdown-section > h1, .markdown-section > h2, .markdown-section > h3, .markdown-section > h4, .markdown-section > h5'));
                var linkTargets = [];
                tocLinks.forEach(function (link) {
                    var href = link.getAttribute('href') || '';
                    var targetId = (href.match(/[?&]id=([^&]+)/) || [,''])[1];
                    try { targetId = decodeURIComponent(targetId); } catch (e) {}
                    linkTargets.push({ li: link.parentElement, id: targetId });
                });

                // 直接调用：查询已全部缓存，单个滚动事件的代价只是
                // 遍历标题做位置比较，无需 rAF（后台标签页 rAF 会被暂停）
                function syncTocActive() {
                    var current = '';
                    for (var i = hs.length - 1; i >= 0; i--) {
                        if (hs[i].getBoundingClientRect().top <= 150) {
                            current = hs[i].id || '';
                            break;
                        }
                    }
                    if (current === lastActive) return;
                    lastActive = current;
                    var activeLi = null;
                    linkTargets.forEach(function (t) {
                        if (t.id === current) {
                            t.li.classList.add('active');
                            activeLi = t.li;
                        } else {
                            t.li.classList.remove('active');
                        }
                    });
                    if (activeLi) {
                        marker.classList.add('visible');
                        marker.style.top = (activeLi.offsetTop + 7) + 'px';
                    } else {
                        marker.classList.remove('visible');
                    }
                }

                if (tocScrollHandler) {
                    window.removeEventListener('scroll', tocScrollHandler);
                }
                tocScrollHandler = syncTocActive;
                window.addEventListener('scroll', syncTocActive, {passive: true});
                syncTocActive();
            }, 200);
        });
    },

    // 侧边栏当前页高亮兜底修正：docsify 把 active 加在 <a> 上，但 sidebar-collapse
    // 插件重写侧边栏 DOM 时会丢失（子目录显示规则 .active + ul 也依赖它），
    // 且侧边栏按路由重新拉取/渲染是异步的，单次延时修正跑不赢。
    // 这里用 MutationObserver 监听侧边栏重写，任何一次重写后都重新应用 active
    function(hook, vm) {
        // docsify 每次路由切换都会整体重建侧边栏 DOM（subMaxLevel 需要重挂子目录），
        // 所有文件夹的 open 状态随之丢失并被插件按 sidebarDisplayLevel 全部折叠。
        // 这里以文件夹标题链接的 href 为标识，记下用户展开过的所有文件夹，
        // 侧边栏每次重建后统一恢复，实现“多个文件夹同时展开且切换页面不收起”
        var openFolders = new Set();
        var snapshotOpen = function () {
            openFolders.clear();
            document.querySelectorAll('.sidebar-nav li.folder.open').forEach(function (li) {
                var a = li.querySelector('a');
                if (a) openFolders.add(a.getAttribute('href'));
            });
        };
        var restoreOpen = function () {
            document.querySelectorAll('.sidebar-nav li.folder').forEach(function (li) {
                var a = li.querySelector('a');
                if (a && openFolders.has(a.getAttribute('href'))) {
                    li.classList.remove('collapsed');
                    li.classList.add('open');
                }
            });
        };
        // 立即版恢复：不依赖插件渲染后打上的 .folder 标记，直接按结构判断文件夹
        // （li 含直接子 ul 即文件夹）。在 MutationObserver 回调里同步调用——回调是
        // 微任务、先于浏览器绘制执行，重建后的侧边栏不会以“全收起”的中间状态上屏，
        // 消除“先收起、防抖 50ms 后再恢复”造成的闪烁
        var restoreOpenNow = function () {
            document.querySelectorAll('.sidebar-nav li').forEach(function (li) {
                var hasUl = false;
                for (var i = 0; i < li.children.length; i++) {
                    if (li.children[i].tagName === 'UL') { hasUl = true; break; }
                }
                if (!hasUl) return;
                var a = li.querySelector('a');
                if (a && openFolders.has(a.getAttribute('href'))) {
                    li.classList.remove('collapsed');
                    li.classList.add('open');
                }
            });
        };
        var applyActive = function () {
            window.__SIDEBAR_FIX__ = 'v6';   // 版本标记：控制台输入 __SIDEBAR_FIX__ 可查当前运行的修复版本（v6=消除侧边栏重建时的展开状态闪烁）
            // 两侧都要安全解码：hash 是百分号编码，而侧边栏 href 里含手写的 %20
            // （如 "Effective Java" 目录），只解码一边会导致含空格的条目永远匹配不上；
            // decode 遇到非法 % 序列会抛 URIError，需要 try/catch 兜底。
            // 还要折叠 "/./" 段：workflow 生成的侧边栏是 "./dir/file.md"（渲染成 #/./dir/file），
            // 正文链接是 "/dir/file.md"（渲染成 #/dir/file），两种路由只差这一段
            var norm = function (p) {
                p = p.replace(/^#/, '').split('?')[0]
                     .replace(/\/\.\//g, '/')   // 折叠 /./（侧边栏与正文链接的形式差异）
                     .replace(/\/+/g, '/')      // 折叠重复斜杠
                     .replace(/\/+$/, '')
                     .replace(/\.md$/i, '');
                try { return decodeURIComponent(p); } catch (e) { return p; }
            };
            var cur = norm(location.hash);
            var activeLi = null;
            document.querySelectorAll('.sidebar-nav a').forEach(function (a) {
                var raw = a.getAttribute('href') || '';
                if (raw.indexOf('?id=') !== -1) return; // 跳过页内锚点链接
                var isCur = norm(raw) === cur;
                a.classList.toggle('active', isCur);
                var li = a.parentElement;
                if (li && li.tagName === 'LI') li.classList.toggle('active', isCur);
                if (isCur) activeLi = li;
            });

            // 先恢复用户手动展开过的其他文件夹，再展开当前条目的祖先文件夹
            // （sidebar-collapse 插件在路由切换后会按 sidebarDisplayLevel 重置为折叠，
            // 当前条目虽然高亮但被藏在文件夹里看不见），并把侧边栏滚动到该条目可见
            restoreOpen();
            if (activeLi) {
                var node = activeLi.parentElement;
                while (node && !node.classList.contains('sidebar-nav')) {
                    if (node.tagName === 'UL') {
                        var folderLi = node.parentElement;
                        if (folderLi && folderLi.classList.contains('folder')) {
                            folderLi.classList.remove('collapsed');
                            folderLi.classList.add('open');
                        }
                    }
                    node = node.parentElement;
                }
                // 滚动侧边栏让当前条目进入视野（block:nearest 只滚动必要的祖先容器）
                try { activeLi.scrollIntoView({block: 'nearest', behavior: 'smooth'}); } catch (e) {}
            }
            // 快照最终的展开状态：含插件自动展开的当前页祖先，供下次重建后恢复
            snapshotOpen();
        };
        var scheduled = false;
        hook.mounted(function () {
            var sidebar = document.querySelector('.sidebar');
            if (!sidebar || typeof MutationObserver === 'undefined') return;
            // 侧边栏 DOM 会被整体重建，这里把点击委托挂在不会被重建的 .sidebar 容器上；
            // 插件的切换监听挂在更深的 .sidebar-nav 上，冒泡先到达，因此这里同步
            // 快照读到的已是插件展开/收起切换后的最终状态，且早于路由触发的重建
            sidebar.addEventListener('click', snapshotOpen);
            new MutationObserver(function () {
                restoreOpenNow();   // 绘制前同步恢复，防止闪一下；下方防抖只负责 active 高亮等完整修正
                if (scheduled) return;
                scheduled = true;
                setTimeout(function () { scheduled = false; applyActive(); }, 50);
            }).observe(sidebar, {childList: true, subtree: true});
        });
        hook.doneEach(function () { setTimeout(applyActive, 50); });
    }
    ]
  };

  // —— mermaid 懒加载实现 ——
  // 与原 docsify-mermaid 的初始化一致：startOnLoad 关闭、主题跟随站点明暗模式，
  // 实际渲染统一在首个图出现时或切换主题后的 run 回调中触发
  function currentMermaidTheme() {
    return document.documentElement.classList.contains('dark') ? 'dark' : 'default';
  }

  // 页内图保持 mermaid 默认的 useMaxWidth:true（缩到容器宽度，版面紧凑），
  // 不再另做压缩/放大；需要看清细节时点击图打开灯箱，
  // 灯箱按 viewBox 恢复自然尺寸（100%）浏览，可缩放/平移
  function mermaidInitConfig() {
    return {
      startOnLoad: false,   // 避免与上面的 mermaid.run 重复渲染
      theme: currentMermaidTheme(),
      suppressErrors: true
    };
  }

  var __mermaidLoading = false;

  function runMermaid() {
    mermaid.run({ querySelector: 'div.mermaid', suppressErrors: true }).then(function () {
      // 渲染成功的图加悬浮提示，告知可点击放大
      document.querySelectorAll('div.mermaid').forEach(function (el) {
        if (el.querySelector('svg')) el.title = '点击放大：滚轮缩放 · 拖动平移 · 双击复位';
      });
    }).catch(function () {});
  }

  function loadMermaidThenRun() {
    if (window.mermaid) { runMermaid(); return; }
    if (__mermaidLoading) return; // 加载完成后的 onload 统一渲染当前 DOM 里的图
    __mermaidLoading = true;
    var s = document.createElement('script');
    s.src = './vendor/mermaid.min.js';
    s.onload = function () {
      __mermaidLoading = false;
      mermaid.initialize(mermaidInitConfig());
      runMermaid();
    };
    s.onerror = function () { __mermaidLoading = false; };
    document.head.appendChild(s);
  }

  // 切换主题后重绘当前页所有图：恢复缓存的源码、清掉已渲染标记，再重新 run。
  // mermaid 尚未加载（本会话还没出现过图）时直接跳过——下次有图的页面会以当前主题渲染
  window.__rerenderMermaid = function () {
    if (!window.mermaid) return;
    var els = document.querySelectorAll('div.mermaid');
    if (!els.length) return;
    mermaid.initialize(mermaidInitConfig());
    els.forEach(function (el) {
      var src = el.__mermaidSrc !== undefined ? el.__mermaidSrc : el.textContent;
      if (!src || !src.trim()) return;
      el.__mermaidSrc = src;
      el.removeAttribute('data-processed');
      el.textContent = src;
    });
    mermaid.run({ querySelector: 'div.mermaid', suppressErrors: true }).catch(function () {});
  };

  // —— 图片 / mermaid 灯箱：点击整屏放大阅读（滚轮缩放 / 拖动平移 / 双指捏合 / 双击复位）——
  // 正文图片与 mermaid 图共用同一灯箱（替代 medium-zoom，其只能整体缩放、无法平移/继续缩放）。
  // 页内一律保持原有大小（图片可能被 zoom/max-width 缩小、mermaid 被压到容器宽度），
  // 点击后按原始尺寸（图片 naturalWidth、svg viewBox）100% 展示；
  // svg 需克隆并改写内部 id 引用，避免与页面原图的同 id 元素互相干扰
  (function () {
    var overlay = null, stage = null, box = null, zoomLabel = null;
    var curW = 0, curH = 0;              // 图的自然尺寸（px）
    var scale = 1, tx = 0, ty = 0;       // box 的 transform 状态
    var MIN_SCALE = 0.05, MAX_SCALE = 24;
    var pointers = new Map();            // 指针按下时才进入，支持单指拖动 / 双指捏合
    var pinch = null, moveDist = 0, downOnEmpty = false;
    var savedOverflow = '';

    function midOf(a, b)  { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
    function distOf(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

    // 克隆 svg 并同步改写内部 id 与 url(#…)/href="#…" 引用：
    // 页面原图携带同批 id，直接克隆会导致引用解析到原图
    // （切换主题原图被重建后，灯箱里的箭头/渐变会整体失效）
    function cloneSvg(svg) {
      var clone = svg.cloneNode(true);
      var idMap = {};
      clone.querySelectorAll('[id]').forEach(function (n) {
        var old = n.getAttribute('id');
        idMap[old] = old + '-lb';
        n.setAttribute('id', idMap[old]);
      });
      clone.querySelectorAll('*').forEach(function (n) {
        for (var i = 0; i < n.attributes.length; i++) {
          var a = n.attributes[i];
          if (a.value.indexOf('url(#') !== -1) {
            a.value = a.value.replace(/url\(#([^)'"]+)\)/g, function (m, id) {
              return idMap[id] ? 'url(#' + idMap[id] + ')' : m;
            });
          } else if ((a.name === 'href' || a.name === 'xlink:href') &&
                     a.value.charAt(0) === '#' && idMap[a.value.slice(1)]) {
            a.value = '#' + idMap[a.value.slice(1)];
          }
        }
      });
      return clone;
    }

    function apply() {
      box.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
      zoomLabel.textContent = Math.round(scale * 100) + '%';
    }

    // 适应屏幕：完整可见（且不超过 100%），居中
    function fit() {
      var pad = 64;
      scale = Math.max(Math.min((stage.clientWidth - pad) / curW,
                                (stage.clientHeight - pad) / curH, 1), MIN_SCALE);
      tx = (stage.clientWidth  - curW * scale) / 2;
      ty = (stage.clientHeight - curH * scale) / 2;
      apply();
    }

    // 原始大小（100%）：打开灯箱的默认视图，文字为设计的字号；
    // 溢出方向对齐起点（横向超宽从左往右读、纵向超高从上往下读），放得下则居中
    function showActual() {
      scale = 1;
      var pad = 32;
      tx = curW <= stage.clientWidth  ? (stage.clientWidth  - curW) / 2 : pad;
      ty = curH <= stage.clientHeight ? (stage.clientHeight - curH) / 2 : pad;
      apply();
    }

    // 以 stage 内 (cx, cy) 为不动点缩放 factor 倍
    function zoomAt(cx, cy, factor) {
      var ns = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
      var k = ns / scale;
      tx = cx - (cx - tx) * k;
      ty = cy - (cy - ty) * k;
      scale = ns;
      apply();
    }

    function stagePoint(e) {
      var r = stage.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    function build() {
      overlay = document.createElement('div');
      overlay.className = 'mermaid-lightbox';

      stage = document.createElement('div');
      stage.className = 'mermaid-lightbox-stage';
      box = document.createElement('div');
      box.className = 'mermaid-lightbox-box';
      stage.appendChild(box);

      var bar = document.createElement('div');
      bar.className = 'mermaid-lightbox-bar';
      function btn(label, title, fn) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'mermaid-lightbox-btn';
        b.textContent = label;
        b.title = title;
        b.addEventListener('click', fn);
        return b;
      }
      function center() { return { x: stage.clientWidth / 2, y: stage.clientHeight / 2 }; }

      var group = document.createElement('div');
      group.className = 'mermaid-lightbox-group';
      zoomLabel = document.createElement('span');
      zoomLabel.className = 'mermaid-lightbox-zoom';
      group.appendChild(btn('−', '缩小', function () { var c = center(); zoomAt(c.x, c.y, 1 / 1.25); }));
      group.appendChild(zoomLabel);
      group.appendChild(btn('+', '放大', function () { var c = center(); zoomAt(c.x, c.y, 1.25); }));
      group.appendChild(btn('1:1', '原始大小', showActual));
      group.appendChild(btn('⤢', '适应屏幕', fit));
      var hint = document.createElement('span');
      hint.className = 'mermaid-lightbox-hint';
      hint.textContent = '滚轮缩放 · 拖动平移 · 双击复位';

      bar.appendChild(group);
      bar.appendChild(hint);
      bar.appendChild(btn('×', '关闭 (Esc)', close));

      overlay.appendChild(stage);
      overlay.appendChild(bar);
      document.body.appendChild(overlay);

      // —— 交互（全部挂在不会随路由重建的灯箱元素上）——
      stage.addEventListener('wheel', function (e) {
        e.preventDefault();
        // 触控板捏合（ctrl+wheel）事件更密集，用更小的步长，避免缩放过冲
        var step = e.deltaY < 0 ? (e.ctrlKey ? 1.06 : 1.2) : (e.ctrlKey ? 1 / 1.06 : 1 / 1.2);
        var p = stagePoint(e);
        zoomAt(p.x, p.y, step);
      }, { passive: false });

      stage.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 1) {
          moveDist = 0;
          downOnEmpty = (e.target === stage);  // 点击空白处（非图上）松开时关闭
        } else if (pointers.size === 2) {
          var arr = Array.from(pointers.values());
          pinch = { mid: midOf(arr[0], arr[1]), dist: distOf(arr[0], arr[1]) };
        }
        try { stage.setPointerCapture(e.pointerId); } catch (err) {}
        stage.classList.add('dragging');
      });

      stage.addEventListener('pointermove', function (e) {
        var p = pointers.get(e.pointerId);
        if (!p) return;
        var dx = e.clientX - p.x, dy = e.clientY - p.y;
        p.x = e.clientX; p.y = e.clientY;

        if (pointers.size === 1) {
          moveDist += Math.abs(dx) + Math.abs(dy);
          tx += dx; ty += dy;
          apply();
        } else if (pointers.size === 2 && pinch) {
          // 双指：按距离比缩放 + 按中点位移平移
          var arr = Array.from(pointers.values());
          var mid = midOf(arr[0], arr[1]), dist = distOf(arr[0], arr[1]);
          if (pinch.dist > 0) zoomAt(mid.x, mid.y, dist / pinch.dist);
          tx += mid.x - pinch.mid.x;
          ty += mid.y - pinch.mid.y;
          apply();
          pinch = { mid: mid, dist: dist };
          moveDist = 9;  // 捏合视为拖动，松手不触发关闭
        }
      });

      function release(e) {
        pointers.delete(e.pointerId);
        if (pointers.size < 2) pinch = null;
        if (!pointers.size) stage.classList.remove('dragging');
        if (e.type === 'pointerup' && downOnEmpty && moveDist < 5) close();
      }
      stage.addEventListener('pointerup', release);
      stage.addEventListener('pointercancel', release);

      stage.addEventListener('dblclick', function (e) { e.preventDefault(); showActual(); });
    }

    // 页内图被 useMaxWidth 压缩过，自然尺寸从 viewBox 取：
    // 没有 viewBox 时退回 width/height 属性，最后兜底当前显示尺寸
    function naturalSize(svg) {
      var vb = svg.viewBox && svg.viewBox.baseVal;
      if (vb && vb.width && vb.height) return { w: vb.width, h: vb.height };
      var w = parseFloat(svg.getAttribute('width')) || 0;
      var h = parseFloat(svg.getAttribute('height')) || 0;
      if (w && h) return { w: w, h: h };
      var r = svg.getBoundingClientRect();
      return { w: r.width, h: r.height };
    }

    // mermaid svg 与正文图片共用一个灯箱：
    // 图片用 naturalWidth/Height 取原始尺寸（页内可能被 zoom/max-width 缩小），
    // svg 走 viewBox
    function openContent(node) {
      if (!overlay) build();
      pointers.clear();
      pinch = null;
      box.innerHTML = '';
      var el, size;
      if (node.tagName === 'IMG') {
        size = {
          w: node.naturalWidth || node.getBoundingClientRect().width,
          h: node.naturalHeight || node.getBoundingClientRect().height
        };
        el = new Image();
        el.src = node.currentSrc || node.src;
        el.alt = node.alt || '';
        el.draggable = false;
      } else {
        size = naturalSize(node);
        el = cloneSvg(node);
      }
      curW = Math.max(1, Math.round(size.w));
      curH = Math.max(1, Math.round(size.h));
      el.style.maxWidth = 'none';
      el.style.width = curW + 'px';
      el.style.height = curH + 'px';
      el.style.display = 'block';
      box.appendChild(el);
      overlay.classList.add('open');
      savedOverflow = document.documentElement.style.overflow;
      document.documentElement.style.overflow = 'hidden';  // 锁住页面滚动
      requestAnimationFrame(showActual);  // 灯箱显示后再量尺寸，默认 100% 原始大小
    }

    function close() {
      if (!overlay || !overlay.classList.contains('open')) return;
      overlay.classList.remove('open');
      box.innerHTML = '';
      pointers.clear();
      pinch = null;
      document.documentElement.style.overflow = savedOverflow;
    }
    window.__closeMermaidLightbox = close;

    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') close();
    });
    window.addEventListener('hashchange', close);  // 灯箱开着时切换页面直接关闭

    // 事件委托：docsify 每次路由都重建正文，挂在 document 上不用反复绑
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || !t.closest) return;
      // 正文图片：未包在链接里（链接图保留跳转）、未标记 .no-zoom 的才开灯箱
      var img = t.closest('.markdown-section img');
      if (img && !img.closest('a') && !img.classList.contains('no-zoom')) {
        openContent(img);
        return;
      }
      var div = t.closest('div.mermaid');
      if (!div) return;
      var svg = div.querySelector('svg');
      if (!svg) return;  // 未渲染成功（语法错误）的图不开灯箱
      openContent(svg);
    });
  })();
  </script>
